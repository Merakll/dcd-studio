<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — DcD Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --lime: #b4f056; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0f100e; color: #fff; font-family: 'Inter', sans-serif; text-align: center; padding: 24px; overflow: hidden; }
    .glow { position: fixed; top: 50%; left: 50%; width: 520px; height: 520px; border-radius: 50%; background: radial-gradient(circle, rgba(180, 240, 86, 0.2), transparent 70%); transform: translate(-50%, -50%); pointer-events: none; animation: pulse 4s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.5; transform: translate(-50%, -50%) scale(1.15); } }
    main { position: relative; }
    .code { font-size: clamp(96px, 22vw, 200px); font-weight: 700; letter-spacing: -6px; line-height: 1; color: var(--lime); text-shadow: 0 0 40px rgba(180, 240, 86, 0.45); }
    h1 { font-size: 28px; margin: 10px 0 12px; }
    p { color: #9a9b98; max-width: 420px; margin: 0 auto 30px; line-height: 1.5; }
    .btns { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
    a { padding: 14px 26px; border-radius: 999px; font-weight: 600; font-size: 15px; text-decoration: none; transition: transform 0.2s; }
    a:hover { transform: translateY(-2px); }
    a:focus-visible { outline: 2px solid var(--lime); outline-offset: 3px; }
    .p { background: var(--lime); color: #0f100e; }
    .s { border: 1px solid rgba(180, 240, 86, 0.4); color: #fff; }
    @media (prefers-reduced-motion: reduce) { .glow { animation: none; } }
  </style>
</head>
<body>
  <div class="glow"></div>
  <main>
    <div class="code">404</div>
    <h1>Этаж не найден</h1>
    <p>Такой страницы нет: возможно, ссылка устарела или в адресе опечатка. Вернитесь на главную или напишите нам в соцсетях.</p>
    <div class="btns">
      <a class="p" data-p="index.html" href="/">На главную →</a>
      <a class="s" href="https://t.me/Dcd_S_tudio" target="_blank" rel="noopener">Telegram</a>
      <a class="s" href="https://vk.ru/dsd_studio" target="_blank" rel="noopener">ВК</a>
    </div>
  </main>
  <script>
    // 404 открывается по любому адресу, поэтому путь к сайту считаем сами:
    // на github.io/<репозиторий>/ база — «/<репозиторий>/», на своём домене — «/»
    (function () {
      var p = location.pathname.split('/');
      var base = /github\.io$/.test(location.hostname) && p[1] ? '/' + p[1] + '/' : '/';
      document.querySelectorAll('a[data-p]').forEach(function (a) { a.href = base + a.dataset.p; });
    })();
  </script>
</body>
</html>
